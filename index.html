<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabutan Bertuah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1e3a8a 0%, #020617 70%, #000000 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* WWTBAM Background Elements */
        .wwtbam-bg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw; height: 150vw;
            background: 
                radial-gradient(circle, transparent 40%, rgba(59, 130, 246, 0.1) 41%, transparent 42%),
                radial-gradient(circle, transparent 50%, rgba(59, 130, 246, 0.1) 51%, transparent 52%),
                radial-gradient(circle, transparent 60%, rgba(59, 130, 246, 0.1) 61%, transparent 62%);
            pointer-events: none;
            z-index: -1;
        }

        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .winner-animation {
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="text-white relative pb-10 overflow-x-hidden">

    <!-- Confetti Canvas -->
    <canvas id="confetti-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-50"></canvas>
    
    <!-- WWTBAM Background Grid/Circles -->
    <div class="wwtbam-bg"></div>

    <div class="container mx-auto px-4 pt-10 pb-8 max-w-6xl">
        <header class="text-center mb-10 flex flex-col items-center">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2 text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 to-yellow-500 drop-shadow-[0_2px_15px_rgba(234,179,8,0.5)]">
                Cabutan Bertuah AIM TVET
            </h1>
            <p class="text-lg text-blue-300 font-medium">Masukkan senarai nama dan mulakan cabutan secara rawak!</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Panel: Configuration & Input -->
            <div class="lg:col-span-1 bg-slate-900/80 backdrop-blur-md rounded-3xl p-6 border border-blue-500/30 shadow-[0_0_25px_rgba(30,58,138,0.6)]">
                <div class="mb-4 flex justify-between items-end">
                    <label for="namesList" class="block text-sm font-semibold text-blue-200">Senarai Nama Peserta</label>
                    <span id="participantCount" class="text-xs font-bold bg-blue-900/60 text-blue-200 px-3 py-1 rounded-full shadow-sm border border-blue-500/30">0 nama</span>
                </div>
                
                <textarea 
                    id="namesList" 
                    rows="15" 
                    class="w-full bg-black/60 text-white rounded-xl p-4 border border-blue-500/40 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 resize-none mb-4 placeholder-slate-500 shadow-inner"
                    placeholder="Sila masukkan nama di sini...&#10;Satu nama untuk setiap baris&#10;Contoh:&#10;Ahmad Bin Abu&#10;Siti Aminah&#10;Chong Wei&#10;Muthu"
                    oninput="updateCount()"
                ></textarea>

                <div class="flex items-center space-x-3 mb-6 bg-black/40 p-4 rounded-xl border border-blue-500/30 shadow-sm">
                    <input type="checkbox" id="removeWinner" class="w-5 h-5 text-yellow-500 rounded focus:ring-yellow-500 bg-slate-800 border-blue-500/50 cursor-pointer" checked>
                    <label for="removeWinner" class="text-sm cursor-pointer select-none font-medium text-blue-100">
                        Buang nama pemenang selepas dicabut (Elak menang 2 kali)
                    </label>
                </div>

                <div class="flex items-center space-x-3 mb-6 bg-black/40 p-4 rounded-xl border border-blue-500/30 shadow-sm">
                    <input type="checkbox" id="soundToggle" class="w-5 h-5 text-yellow-500 rounded focus:ring-yellow-500 bg-slate-800 border-blue-500/50 cursor-pointer" checked>
                    <label for="soundToggle" class="text-sm cursor-pointer select-none font-medium text-blue-100">
                        Mainkan Bunyi (Sound Effects)
                    </label>
                </div>

                <button 
                    onclick="clearList()"
                    class="w-full py-2 px-4 bg-slate-800 hover:bg-red-900/80 transition-colors rounded-xl text-sm font-semibold border border-blue-500/30 shadow-sm text-blue-200 hover:text-white">
                    Bersihkan Senarai
                </button>
            </div>

            <!-- Right Panel: Draw Area & Winners -->
            <div class="lg:col-span-2 flex flex-col gap-8">
                
                <!-- Display Area -->
                <div class="bg-slate-900/80 backdrop-blur-md rounded-3xl p-8 border border-blue-500/30 shadow-[0_0_30px_rgba(30,58,138,0.8)] flex flex-col items-center justify-center min-h-[400px] relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-t from-blue-900/20 to-transparent pointer-events-none"></div>
                    
                    <div class="text-center z-10 w-full px-4">
                        <h2 class="text-sm font-bold text-blue-400 mb-8 uppercase tracking-widest drop-shadow-md">Pemenang</h2>
                        
                        <div id="winnerDisplay" class="text-4xl md:text-7xl font-extrabold text-white break-words drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] transition-all duration-300 min-h-[120px] flex items-center justify-center">
                            Sedia...
                        </div>
                    </div>

                    <button 
                        id="drawBtn"
                        onclick="startDraw()"
                        class="mt-12 w-full max-w-md py-5 px-8 bg-gradient-to-b from-blue-900 to-black border-2 border-yellow-500 hover:border-yellow-400 text-yellow-400 hover:text-yellow-300 rounded-full text-2xl font-bold shadow-[0_0_20px_rgba(234,179,8,0.4)] hover:shadow-[0_0_30px_rgba(234,179,8,0.7)] transform transition hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none uppercase tracking-wider relative overflow-hidden group">
                        <div class="absolute inset-0 bg-yellow-400/0 group-hover:bg-yellow-400/10 transition-colors pointer-events-none"></div>
                        <span class="relative z-10">🎰 MULA CABUTAN 🎰</span>
                    </button>
                </div>

                <!-- Winners List -->
                <div class="bg-slate-900/80 backdrop-blur-md rounded-3xl p-6 border border-blue-500/30 shadow-[0_0_25px_rgba(30,58,138,0.6)]">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold flex items-center gap-2 text-yellow-500 drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]">
                            🏆 Senarai Pemenang Lalu
                        </h3>
                        <span id="winnersCount" class="text-sm bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 px-3 py-1 rounded-full font-bold shadow-sm">0 pemenang</span>
                    </div>
                    
                    <div id="winnersListContainer" class="bg-black/50 rounded-xl p-4 min-h-[100px] max-h-[250px] overflow-y-auto shadow-inner border border-blue-500/30">
                        <ul id="winnersUl" class="space-y-2 text-white">
                            <li class="text-center text-blue-400/50 italic py-4" id="emptyWinnerMsg">Belum ada pemenang lagi.</li>
                        </ul>
                    </div>
                    
                    <button 
                        onclick="clearWinners()"
                        class="mt-4 text-xs text-blue-400 hover:text-red-400 transition-colors underline font-medium">
                        Kosongkan Senarai Pemenang
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Modals / Notifications container (optional) -->
    <div id="notification" class="fixed top-5 right-5 bg-red-600 text-white px-6 py-3 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] transform transition-transform translate-x-[150%] z-50 font-semibold border border-red-400">
        Sila masukkan nama peserta!
    </div>

    <!-- Custom Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-slate-900 border border-blue-500/50 rounded-2xl p-6 max-w-sm w-full shadow-[0_0_30px_rgba(30,58,138,0.8)] text-center transform scale-95 transition-transform duration-200" id="confirmModalBox">
            <h3 class="text-xl font-bold text-yellow-500 mb-6 drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]" id="confirmModalMsg">Adakah anda pasti?</h3>
            <div class="flex gap-4 justify-center">
                <button onclick="closeConfirm()" class="px-6 py-2 rounded-full bg-slate-800 text-blue-200 hover:bg-slate-700 transition border border-blue-500/30 font-semibold">Batal</button>
                <button onclick="executeConfirm()" class="px-6 py-2 rounded-full bg-red-600 text-white hover:bg-red-500 shadow-[0_0_15px_rgba(220,38,38,0.5)] transition border border-red-400 font-semibold">Pasti</button>
            </div>
        </div>
    </div>

    <script>
        // --- Variables ---
        let drawInterval;
        let isDrawing = false;
        let winners = [];
        let currentConfirmAction = null; // Variable for custom confirm modal

        // --- Custom Confirm Logic ---
        function showConfirm(msg, action) {
            document.getElementById('confirmModalMsg').innerText = msg;
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmModalBox');
            modal.classList.remove('hidden');
            // Timeout for CSS transition effect
            setTimeout(() => {
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
            currentConfirmAction = action;
        }

        function closeConfirm() {
            const modal = document.getElementById('confirmModal');
            const box = document.getElementById('confirmModalBox');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
            currentConfirmAction = null;
        }

        function executeConfirm() {
            if (currentConfirmAction) {
                currentConfirmAction();
            }
            closeConfirm();
        }

        // --- Audio System ---
        let audioCtx;
        let suspenseOsc;
        let suspenseGain;
        let suspenseLfo;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSuspenseDrone() {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();

            // Bunyi dron latar belakang yang LEBIH mendebarkan (Pitch naik & denyutan laju)
            suspenseOsc = audioCtx.createOscillator();
            suspenseGain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            // 1. Dron Bass (Pitch akan naik perlahan-lahan untuk bina ketegangan)
            suspenseOsc.type = 'sawtooth';
            suspenseOsc.frequency.setValueAtTime(45, audioCtx.currentTime); 
            suspenseOsc.frequency.linearRampToValueAtTime(85, audioCtx.currentTime + 3); 

            // 2. LFO untuk efek "Denyutan Jantung" yang semakin laju
            suspenseLfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            suspenseLfo.type = 'sine';
            suspenseLfo.frequency.setValueAtTime(3, audioCtx.currentTime); // Mula dengan 3 denyutan/saat
            suspenseLfo.frequency.linearRampToValueAtTime(14, audioCtx.currentTime + 3); // Laju ke 14 denyutan/saat
            
            suspenseLfo.connect(lfoGain);
            lfoGain.gain.value = 0.7; // Kedalaman denyutan
            
            // Node gain tambahan untuk denyutan
            const throbGain = audioCtx.createGain();
            throbGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            lfoGain.connect(throbGain.gain);

            filter.type = 'lowpass';
            // Filter terbuka perlahan-lahan untuk bunyi yang semakin jelas dan bingit
            filter.frequency.setValueAtTime(150, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 3); 

            suspenseGain.gain.setValueAtTime(0, audioCtx.currentTime);
            suspenseGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.5); // Fade in

            // Sambungan: Osc -> Filter -> Throb(Denyutan) -> Master Gain -> Speaker
            suspenseOsc.connect(filter);
            filter.connect(throbGain);
            throbGain.connect(suspenseGain);
            suspenseGain.connect(audioCtx.destination);

            suspenseOsc.start();
            suspenseLfo.start();
        }

        function stopSuspenseDrone() {
            if (suspenseGain && suspenseOsc) {
                suspenseGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                setTimeout(() => {
                    try { 
                        suspenseOsc.stop(); 
                        if(suspenseLfo) suspenseLfo.stop();
                    } catch(e){}
                }, 100);
            }
        }

        function playTick() {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            // Bunyi "blip" logam (triangle) yang tajam dan mendebarkan
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
            
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playApplause() {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();

            const duration = 4; // 4 saat bunyi tepukan
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * duration;
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);

            // Menjana 'white noise' dengan lonjakan rawak untuk simulasi tepuk tangan beramai-ramai
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (Math.random() < 0.1 ? 1 : 0.2);
            }

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = buffer;

            // Penapis Bandpass untuk membuang bunyi statik tinggi dan membentuk bunyi seakan tepukan
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;
            filter.Q.value = 0.5;

            // Kawalan kelantangan (fade in dan fade out yang perlahan)
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(1.2, audioCtx.currentTime + 0.5); // Naikkan volume perlahan-lahan
            gainNode.gain.setValueAtTime(1.2, audioCtx.currentTime + duration - 1.5); // Kekalkan kelantangan
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration); // Hilang perlahan-lahan (fade out)

            noiseSource.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseSource.start();
        }

        function playWinSound() {
            if (!document.getElementById('soundToggle').checked) return;
            initAudio();
            
            // Kord "Jawapan Betul" WWTBAM (Kord Major Synthesizer yang megah)
            const frequencies = [261.63, 329.63, 392.00, 523.25, 659.25]; // C4, E4, G4, C5, E5
            
            frequencies.forEach((freq) => {
                const osc = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sawtooth'; // Bunyi seakan 'brass' atau pad tebal
                osc.frequency.value = freq;
                
                // Sweep penapis untuk efek "impact"
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(3000, audioCtx.currentTime + 0.1);
                filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 3.0);
                
                // Attack yang tajam, decay yang panjang
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);
                
                osc.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 3.0);
            });

            // Tambah bunyi dentuman bass (impact) di awal
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sine';
            bassOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            bassOsc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.0);
            bassGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
            bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
            bassOsc.connect(bassGain);
            bassGain.connect(audioCtx.destination);
            bassOsc.start();
            bassOsc.stop(audioCtx.currentTime + 2.0);
        }

        // --- Functions ---
        function getNamesList() {
            const text = document.getElementById('namesList').value;
            // Split by newline, remove empty spaces, and filter out empty lines
            return text.split('\n').map(name => name.trim()).filter(name => name !== '');
        }

        function updateCount() {
            const count = getNamesList().length;
            document.getElementById('participantCount').innerText = `${count} nama`;
        }

        function clearList() {
            showConfirm("Adakah anda pasti untuk membersihkan senarai nama peserta?", () => {
                document.getElementById('namesList').value = '';
                updateCount();
            });
        }

        function showNotification(message, isError = true) {
            const notif = document.getElementById('notification');
            notif.innerText = message;
            notif.className = `fixed top-5 right-5 px-6 py-3 rounded-xl shadow-2xl transform transition-transform z-50 font-semibold ${isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
            
            // Slide in
            notif.style.transform = 'translateX(0)';
            
            // Slide out after 3s
            setTimeout(() => {
                notif.style.transform = 'translateX(150%)';
            }, 3000);
        }

        function startDraw() {
            if (isDrawing) return;

            const names = getNamesList();
            if (names.length === 0) {
                showNotification("Sila masukkan sekurang-kurangnya satu nama!");
                return;
            }
            if (names.length === 1) {
                showNotification("Perlu lebih daripada 1 nama untuk membuat cabutan.");
                return;
            }

            isDrawing = true;
            const btn = document.getElementById('drawBtn');
            const display = document.getElementById('winnerDisplay');
            
            btn.disabled = true;
            btn.querySelector('span').innerText = "SEDANG MENCABUT...";
            
            // Reset styles
            display.className = 'text-4xl md:text-7xl font-extrabold text-white break-words drop-shadow-[0_0_10px_rgba(255,255,255,0.5)] transition-all duration-300 min-h-[120px] flex items-center justify-center';

            // Draw effect timing
            const duration = 3000; // 3 seconds rolling
            const endTime = Date.now() + duration;

            initAudio(); // Initialize audio context on user click
            playSuspenseDrone(); // Mulakan bunyi debaran WWTBAM

            // Rolling sound effect replacement (visual fast updating)
            drawInterval = setInterval(() => {
                const randomName = names[Math.floor(Math.random() * names.length)];
                display.innerText = randomName;

                // Mainkan bunyi detik pada setiap pertukaran nama
                playTick(); 

                if (Date.now() >= endTime) {
                    clearInterval(drawInterval);
                    finishDraw(names);
                }
            }, 50); // Update every 50ms for smooth rolling effect
        }

        function finishDraw(currentNames) {
            const finalIndex = Math.floor(Math.random() * currentNames.length);
            const winner = currentNames[finalIndex];
            
            const display = document.getElementById('winnerDisplay');
            display.innerText = winner;
            
            stopSuspenseDrone(); // Hentikan bunyi debaran

            // Apply winner styling
            display.className = 'text-4xl md:text-7xl font-extrabold text-yellow-400 break-words drop-shadow-[0_0_25px_rgba(234,179,8,1)] transition-all duration-300 min-h-[120px] flex items-center justify-center winner-animation';

            // Fire confetti!
            fireConfetti();

            // Play Win Sound!
            playWinSound();
            
            // Play Applause Sound!
            playApplause();

            // Handle winner logic
            addWinnerToList(winner);

            // Check if we need to remove the winner
            if (document.getElementById('removeWinner').checked) {
                // Remove from textarea
                currentNames.splice(finalIndex, 1);
                document.getElementById('namesList').value = currentNames.join('\n');
                updateCount();
            }

            // Reset UI
            isDrawing = false;
            const btn = document.getElementById('drawBtn');
            btn.disabled = false;
            btn.querySelector('span').innerText = "🎰 MULA CABUTAN 🎰";
        }

        function addWinnerToList(name) {
            winners.unshift(name); // Add to beginning of array
            document.getElementById('winnersCount').innerText = `${winners.length} pemenang`;
            
            const ul = document.getElementById('winnersUl');
            const emptyMsg = document.getElementById('emptyWinnerMsg');
            
            if (emptyMsg) {
                emptyMsg.remove();
            }

            const li = document.createElement('li');
            li.className = 'flex items-center gap-3 p-3 bg-blue-950/60 rounded-lg border border-blue-500/40 shadow-[0_0_10px_rgba(30,58,138,0.5)] animate-[pop_0.3s_ease-out_forwards]';
            li.innerHTML = `
                <span class="bg-gradient-to-br from-yellow-400 to-yellow-600 text-black w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 shadow-[0_0_10px_rgba(234,179,8,0.5)]">
                    ${winners.length}
                </span>
                <span class="font-semibold text-lg break-all text-blue-50">${name}</span>
            `;
            
            ul.insertBefore(li, ul.firstChild);
        }

        function clearWinners() {
            if(winners.length > 0) {
                showConfirm("Adakah anda pasti untuk mengosongkan senarai pemenang?", () => {
                    winners = [];
                    document.getElementById('winnersCount').innerText = `0 pemenang`;
                    document.getElementById('winnersUl').innerHTML = '<li class="text-center text-blue-400/50 italic py-4" id="emptyWinnerMsg">Belum ada pemenang lagi.</li>';
                });
            }
        }

        // --- Simple Confetti Particle System ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function fireConfetti() {
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#00e5ff'];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 20 - 10,
                    dy: Math.random() * -20 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            if(particles.length > 0 && particles.length <= 150) {
                animateConfetti();
            }
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.2; // gravity
                p.y += p.dy;
                p.x += p.dx;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                // Remove particles out of bounds
                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
        }

        // Initial setup
        updateCount();
    </script>
</body>
</html>
